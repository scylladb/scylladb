extra_scylla_cmdline_options:
  - '--logger-log-level=alternator-auth=trace'
  - '--logger-log-level=alternator-conditions=trace'
  - '--logger-log-level=alternator-executor=trace'
  - '--logger-log-level=alternator-serialization=trace'
  - '--logger-log-level=alternator-server=trace'
  - '--logger-log-level=alternator-executor=trace'
  - '--logger-log-level=alternator_controller=trace'
  - '--logger-log-level=alternator_ttl=trace'
  - '--logger-log-level=paxos=trace'
  - '--tablet-load-stats-refresh-interval-in-seconds=1'
  - '--tablets-initial-scale-factor=1'
extra_scylla_config_options:
  {
    experimental_features: [
                             udf
    ],
    alternator_port: 8000,
    query_tombstone_page_limit: 1000,
    alternator_write_isolation: only_rmw_uses_lwt,
    alternator_enforce_authorization: True,
    alternator_timeout_in_ms: 30000,
    alternator_ttl_period_in_seconds: 0.5,
    alternator_streams_time_window_s: 0,
    tablets_mode_for_new_keyspaces: enabled,
    # Many tests write tombstones and expect them to live on for the
    # duration of the test, not to be garbage-collected in the middle of
    # it at some random point that depends on timing. The "timeout" mode
    # with the default gc_grace_seconds of 10 days guarantees that,
    # unlike the default "repair" mode which with RF=1 can purge a
    # tombstone as soon as the clock crosses a whole-second boundary and
    # a compaction happens to run.
    default_tombstone_gc_mode: timeout
  }
