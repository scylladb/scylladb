[pytest]
xfail_strict = true

addopts = --strict-markers  --strict-config

asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

junit_logging = all
junit_log_passing_tests = False

log_format = %(asctime)s.%(msecs)03d %(levelname)s>  %(message)s
log_date_format = %H:%M:%S
log_file_format = %(asctime)s.%(msecs)03d %(processName)s %(threadName)s %(taskName)s %(levelname)s %(name)s>  %(message)s

#Capture logs, folder pytest_tests_logs
log_level=INFO

#File logs, folder pytest_logs
log_file_level = INFO

markers =
    slow: tests that take more than 30 seconds to run
    replication_factor: replication factor for RandomTables
    without_scylla: run without attaching to a scylla process
    enable_tablets: create keyspace with tablets enabled or disabled
    repair: tests for repair
    cpp: marker for c++ tests
    prepare_3_nodes_cluster: prepare 3 nodes cluster for test case based on suite.yaml (all tests from old topology folder)
    prepare_3_racks_cluster: prepare 3 nodes cluster in 1 dc and 3 racks for test case based on suite.yaml
    single_node: test that are mark like this, should be using only one node, and should boot much quicker (dtest only)
    check_nodes_for_errors: when set, take into account all produced errors, not just critical ones
    exclude_errors: do not consider a logging message as an error if it contains any of the specified strings (dtest only)
    cluster_options: specify cluster options used to initialize a cluster (dtest only)
    perf: mark for performance tests, these tests will automatically apply non_gating marker
    manual: to mark manual test cases, these tests will automatically apply non_gating marker
    no_parallel: for genuinely heavy tests that must not run in parallel with other tests, they run in a separate step of the Nightly pipeline with parallelization 1, these tests will automatically apply non_gating marker
    non_gating: tests that are not run in CI/Next/Nightly verification, but can be run manually or on special job when needed
    tier2: for tests that are quite old, stable, and test functionality that rather not be changed or affected by other features, are partially covered in other tests, verify non-critical functionality, have not found any issues or regressions, too long to run on every PR,  and can be popped out from the CI run, but will continue run in Next/Nightly verification
    skip_mode(mode, reason, platform_key=None): Skip test in a specific build mode (e.g. dev, debug, release).
    skip_bug(link=..., reason=...): Skip due to a known bug (link = issue URL, reason = human-readable explanation).
    skip_env(reason): Skip due to a missing environment requirement.
    skip_storage(*flavors, reason=...): Skip the named storage fixture flavors ('s3', 'gs') before one is provisioned.
    next_gating: test that are used of gating tests (dtest only)
    scylla_cdc: test against CDC functionality (https://docs.scylladb.com/using-scylla/cdc/) (dtest only)
    dtest_full: the full dtest suite, we run daily on master (and release branches) (dtest only)
    dtest_debug: test selection for debug version (dtest only)
    dtest_smoke: few sanity check test we run in next before the rest of the suite `next_gating` (dtest only)
    dtest_long: tests that are taking more than 30min (dtest only)
    dtest_heavy: tests that needs more then 4 cpus for working (dtest only)
    skip_if: skip a test if the given condition holds (dtest only)
    unmark_if: remove specified marker if the given condition holds (dtest only)
    require: test should be skipped until issue is closed/fixed (dtest only)
    scylla_mode: used to skip test base on their scylla mode ex. `@pytest.mark.scylla_mode('!debug')` (dtest only)
    resource_intensive: resource intensive (inherited from cassandra-dtest, we didn't have a clear definition of what it means) (dtest only)
    high_memory: tests that consume significantly more memory than average (e.g. large cassandra-stress runs); avoid running these in parallel to prevent host OOM (dtest only)
    scylla_manager: Tests for scylla manager (dtest only)
    no_boot_speedups: tests that currently fails with `skip_wait_for_gossip_to_settle: 0` (dtest only)
    noop: label that doesn't do anything, just a fill for using conditional logic (ex. requireif) (dtest only)
    required_features: specify condition to run test based on enabled features (e.g. "consistent-topology-changes") (dtest only)
    use_cassandra_stress: marker to indicate that the test uses cassandra-stress (dtest only)
    lwt: test that are related to lwt regression (dtest only)
    tools_unittest: internal unit tests under tools directory that don't require scylla running (dtest only)

norecursedirs = manual perf lib pylib_test
# Ignore warnings about HTTPS requests without certificate verification
# (see issue #15287). Pytest breaks urllib3.disable_warnings() in conftest.py,
# so we need to do this here.
#
# Ignore warning of
#   PytestWarning: record_property is incompatible with junit_family 'xunit2' (use 'legacy' or 'xunit1')
# Because `record_property` adds <properties> inside <testcase>, which is not allowed
# as per the latest xunit2 schema. see
# https://github.com/windyroad/JUnit-Schema/blob/master/JUnit.xsdtestcase,
# an alternative is `record_testsuite_property`, but we want to attach test
# log on a per-test basis. so let's continue using this feature before
# switching to xunit1 or legacy.
filterwarnings =
    ignore::urllib3.exceptions.InsecureRequestWarning
    ignore:record_property is incompatible with junit_family:pytest.PytestWarning
    ignore::DeprecationWarning:importlib._bootstrap
    ignore::DeprecationWarning:botocore
    ignore::DeprecationWarning:pytest_elk_reporter
    ignore::sqlalchemy.exc.MovedIn20Warning:kmip.pie.sqltypes
    ignore::cryptography.utils.CryptographyDeprecationWarning:kmip
    ignore:TypeDecorator .* will not produce a cache key:sqlalchemy.exc.SAWarning:kmip
    ignore:Exception in thread[\s\S]*kmip[\s\S]*shutdown:pytest.PytestUnhandledThreadExceptionWarning


tmp_path_retention_count = 1
tmp_path_retention_policy = failed

python_files = test_*.py *_test.py *_tests.py
