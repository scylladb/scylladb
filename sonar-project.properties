# --- Project identity ---
sonar.projectKey=scylladb
sonar.projectName=ScyllaDB
# NOTE: no sonar.projectBaseDir here. Inside the sonar-scanner-cli container the
# sources are mounted at /usr/src; the scanner defaults the base dir to that
# working directory. A host path here would not exist in the container.
sonar.sourceEncoding=UTF-8

# --- Local SonarQube instance (POC) ---
sonar.host.url=http://localhost:9090
# Don't put a real token here -- this file is tracked. Pass SONAR_TOKEN as an
# env var to docker/sonarqube/sonarqube.sh scan instead (or let `provision`
# save one to docker/sonarqube/.env, which `scan` picks up automatically).

# --- SCM ---
# This checkout is a git *worktree*: .git here is just a file with
# "gitdir: <main-repo>/.git/worktrees/<name>" -- the real object database and
# refs live under the main repo's .git, not under this directory. If the
# scanner container only mounts this worktree, JGit can't resolve that
# absolute path and blame data is unavailable. Get blame working by ALSO
# bind-mounting the main repo's .git dir into the container at the exact same
# absolute host path (so the reference in .git resolves), e.g.:
#   MAIN_GIT_DIR="$(git rev-parse --git-common-dir)"
#   docker run --rm --network=host -v "$PWD:/usr/src" \
#     -v "$MAIN_GIT_DIR:$MAIN_GIT_DIR:ro" sonarsource/sonar-scanner-cli
sonar.scm.disabled=false

# --- Sources ---
# ScyllaDB uses .cc/.hh (not .cpp/.h) for most C++ files; include common
# variants so sonar-cxx actually indexes the sources and attaches coverage.
# NOTE: sonar-cxx treats this as a GLOBAL-only setting (ships disabled,
# value "-") and silently ignores it here at the project/scanner level --
# `docker/sonarqube/sonarqube.sh provision` sets it via the API. Kept here
# only as documentation of the intended value.
sonar.cxx.file.suffixes=.cc,.hh,.h,.hpp,.cpp,.cxx,.c

# --- Exclude from MAIN analysis (submodules, build output, and the
#     test dir so the main/test file sets stay disjoint) ---
sonar.exclusions=\
  seastar/**,\
  abseil/**,\
  swagger-ui/**,\
  tools/python3/**,\
  tools/cqlsh/**,\
  scripts/**,\
  tools/**,\
  dist/**,\
  kmip/**,\
  kmipc/**,\
  build/**,\
  testlog/**,\
  test/**,\
  docs/**,\
  **/*.profraw,\
  **/*.profdata,\
  scylla-gdb.py,\
  configure.py,\
  idl-compiler.py,\
  test.py,\
  fix_system_distributed_tables.py,\
  pgo/pgo.py,\
  gen_segmented_compress_params.py

# --- Belt-and-suspenders: keep submodules/build out of coverage too ---
sonar.coverage.exclusions=\
  seastar/**,\
  abseil/**,\
  swagger-ui/**,\
  tools/python3/**,\
  tools/cqlsh/**,\
  kmip/**,\
  kmipc/**,\
  build/**,\
  testlog/**,\
  test/**,\
  docs/**,\
  **/*.profraw,\
  **/*.profdata

# --- Coverage report import (sonar-cxx plugin) ---
# C/C++ coverage via the sonar-cxx plugin. The only practical coverage importer
# for LLVM source-based coverage is Cobertura XML. The report is generated by
# scripts/sonar-coverage.sh (raw .profraw -> .profdata -> lcov -> Cobertura).
sonar.cxx.cobertura.reportPaths=testlog/coverage/sonar/coverage.cobertura.xml
#
# Note: files under sonar.exclusions (seastar/abseil/build/test/...) are not
# indexed, so any coverage they carry in the report is simply ignored by Sonar.
#
# --- External C++ issue reports ---
# The assigned CXX quality profile enables only high-severity native/imported
# C++ rules. Keep these report paths enabled when you want clang-tidy/cppcheck
# findings in SonarQube; override them to empty on the scanner command line for
# a native-sonar-only run.
sonar.cxx.clangtidy.reportPaths=testlog/coverage/sonar/clang-tidy.txt
sonar.cxx.cppcheck.reportPaths=testlog/coverage/sonar/cppcheck.xml
# sonar.cxx.gcc.reportPaths=build/coverage/gcc-warnings.log
#
# Python coverage (if/when added): sonar.python.coverage.reportPaths=coverage.xml
