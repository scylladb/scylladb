# Server-side SonarQube configuration for the ScyllaDB SonarQube POC.
#
# This file is bind-mounted read-only into the container at
#   /opt/sonarqube/conf/sonar.properties
# Edit it and run `./sonarqube.sh restart` to change server behaviour.
# This is the primary "inject configuration into the container" hook.

# --- Web server ---
sonar.web.port=9000

# --- Database ---
# The bundled embedded H2 database is fine for a local POC.
# Do NOT use H2 in production. To use an external PostgreSQL instead, set:
# sonar.jdbc.username=sonar
# sonar.jdbc.password=sonar
# sonar.jdbc.url=jdbc:postgresql://db:5432/sonar

# --- Telemetry ---
# Disable outbound telemetry for a local POC.
sonar.telemetry.enable=false

# --- JVM sizing ---
# Raise these if analysis of the whole ScyllaDB tree runs out of memory.
# sonar.web.javaOpts=-Xmx2g -Xms512m
# sonar.search.javaOpts=-Xmx2g -Xms512m
# sonar.ce.javaOpts=-Xmx2g -Xms512m
