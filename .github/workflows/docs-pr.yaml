name: "Docs / Build PR"
# For more information,
# see https://sphinx-theme.scylladb.com/stable/deployment/production.html#available-workflows

permissions:
  contents: read

env:
  FLAG: ${{ github.repository == 'scylladb/scylla-enterprise' && 'enterprise' || 'opensource' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
      - master
      - enterprise
    # The docs build also consumes sources outside docs/ (see docs/_ext/):
    # scylladb_metrics parses metrics from every *.cc file, scylladb_cc_properties
    # reads db/config.*, and scylladb_swagger reads api/. Changes to any of them
    # can break the build, so they must trigger it too.
    paths:
      - "docs/**"
      - "uv.lock"
      - "db/config.hh"
      - "**/*.cc"
      - "api/**"
      - "scripts/get_description.py"
      - "scripts/metrics-config.yml"
      - ".github/workflows/docs-pr.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      - name: Set up env
        run: make -C docs FLAG="${{ env.FLAG }}" setupenv
      - name: Check redirects
        run: make -C docs FLAG=manual check-redirects

      - name: Build docs
        id: docs-build
        shell: bash
        run: |
          make -C docs FLAG="${{ env.FLAG }}" test SPHINXOPTS="-j auto -w $RUNNER_TEMP/docs-warnings.log" \
            2>&1 | tee "$RUNNER_TEMP/docs-build.log"

      - name: Summarize docs diagnostics
        if: always()
        uses: scylladb/sphinx-scylladb-theme/.github/actions/docs-report@0d821fc4038ee9ad6363362c02035132489bf3f6
        with:
          build-outcome: ${{ steps.docs-build.outcome }}
