name: Build with the latest Seastar

on:
  schedule:
    # 5AM everyday
    - cron: '0 5 * * *'

permissions: 
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: build
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  read-toolchain:
    uses: ./.github/workflows/read-toolchain.yaml
  build-with-the-latest-seastar:
    needs:
      - read-toolchain
    runs-on: ubuntu-latest
    container: ${{ needs.read-toolchain.outputs.image }}
    strategy:
      matrix:
        include:
          - build_type: Debug
            mode: debug
          - build_type: RelWithDebInfo
            mode: release
          - build_type: Dev
            mode: dev
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - run: |
          rm -rf seastar
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: scylladb/seastar
          submodules: true
          path: seastar
      - name: Generate the building system
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          ./configure.py --use-cmake --mode=${{ matrix.mode }} --build-dir=$BUILD_DIR --install-dependencies-only
          cmake                                         \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH=$PWD/$BUILD_DIR/conan/cmake \
            -DCMAKE_C_COMPILER=clang                    \
            -DCMAKE_CXX_COMPILER=clang++                \
            -G Ninja                                    \
            -B $BUILD_DIR                               \
            -S .
      - run: |
          cmake --build $BUILD_DIR --target scylla
