name: Mark PR as Ready When Conflicts Label is Removed

on:
  pull_request_target:
    types:
      - unlabeled

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mark-ready:
    if: github.event.label.name == 'conflicts'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Mark pull request as ready for review
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          # Keep using the backport token rather than GITHUB_TOKEN so that the
          # resulting ready_for_review event still starts downstream workflows.
          github-token: ${{ secrets.AUTO_BACKPORT_TOKEN }}
          script: |
            await github.graphql(
              `mutation($id: ID!) {
                 markPullRequestReadyForReview(input: {pullRequestId: $id}) {
                   pullRequest { isDraft }
                 }
               }`,
              { id: context.payload.pull_request.node_id }
            );
