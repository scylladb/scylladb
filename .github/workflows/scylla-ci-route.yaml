name: Scylla CI Route

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, unlabeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to trigger CI for'
        required: true
        type: string
      target_repo:
        description: 'Repository owner/name (default: scylladb/scylladb)'
        required: false
        default: 'scylladb/scylladb'
        type: string

# Deny all by default; each job grants only what it needs.
permissions: {}

jobs:
  route-ci:
    # Run on:
    # 1. PR events (opened/reopened/synchronize/ready_for_review) for non-draft PRs
    # 2. PR unlabeled event when 'conflicts' label is removed
    # 3. issue_comment event when a non-bot org member comments an @scylladbbot
    #    command: 'trigger-ci', 'trigger-thin-ci' (thin CI on a draft PR) or 'help'
    # 4. workflow_dispatch (manual trigger for testing)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.action != 'unlabeled' && !github.event.pull_request.draft) ||
      (github.event_name == 'pull_request_target' && github.event.action == 'unlabeled' && github.event.label.name == 'conflicts') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.login != 'scylladbbot')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write # publish Jenkins CI status updates on the PR commit
      issues: write # remove the stale 'conflicts' label
    env:
      JENKINS_URL: "https://jenkins.scylladb.com"

    steps:
      - name: Set up gh api retry helper
        shell: bash
        run: |
          # Write a reusable retry wrapper for gh api calls.
          # We write to a known file and set BASH_ENV so subsequent steps source it.
          HELPERS_FILE="$RUNNER_TEMP/.bash_helpers"
          cat > "$HELPERS_FILE" << 'RETRY_EOF'
          gh_api_retry() {
            local max_attempts=4 attempt=1 delay=1 output rc http_code
            while [ $attempt -le $max_attempts ]; do
              rc=0
              output=$(gh api "$@" 2>&1) || rc=$?
              if [ $rc -eq 0 ]; then
                # Only emit when there is output: --silent calls produce none,
                # and an unconditional trailing newline would corrupt callers
                # that read the result via "$(gh_api_retry ...)".
                [ -n "$output" ] && printf '%s\n' "$output"
                return 0
              fi
              # On HTTP errors gh prints "... (HTTP NNN)" on stderr. Extract the
              # numeric status rather than matching a fragile substring, so we
              # can decide per-class whether the failure is worth retrying.
              http_code=$(printf '%s' "$output" | grep -oE 'HTTP [0-9]{3}' | tail -1 | grep -oE '[0-9]{3}')
              case "$http_code" in
                # 403 and 429 mean rate limiting (per GitHub REST API docs) and
                # 5xx are transient server errors: retry these.
                403|429|5??) ;;
                # Any other 4xx (e.g. a 404 for a non-member) is a definitive
                # answer, not a transient failure: bail out immediately instead
                # of wasting retries or masking the result for membership checks.
                4??)
                  printf '%s\n' "$output" >&2
                  return $rc
                  ;;
              esac
              if [ $attempt -eq $max_attempts ]; then
                printf '%s\n' "$output" >&2
                return $rc
              fi
              echo "gh api attempt $attempt failed, retrying in ${delay}s..." >&2
              sleep $delay
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }

          # Reply on a PR as scylladbbot (needs BOT_TOKEN in the step env).
          # Usage: post_bot_reply <repo> <pr-number> <body>
          post_bot_reply() {
            # Without a token gh fails with an auth error that has no HTTP code,
            # which gh_api_retry would retry as transient
            if [ -z "$BOT_TOKEN" ]; then
              echo "::warning::No bot token, not posting reply on $1#$2"
              return 0
            fi
            GH_TOKEN="$BOT_TOKEN" gh_api_retry "repos/$1/issues/$2/comments" -f body="$3" --silent \
              || echo "::warning::Failed to post reply on $1#$2"
          }
          RETRY_EOF
          echo "BASH_ENV=$HELPERS_FILE" >> "$GITHUB_ENV"

      - name: Validate comment trigger
        if: github.event_name == 'issue_comment'
        id: comment-check
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
        shell: bash
        run: |
          # Check org membership
          if [[ "$COMMENT_ASSOCIATION" != "MEMBER" && "$COMMENT_ASSOCIATION" != "OWNER" ]]; then
            echo "::warning::Comment author is not an org member (association: $COMMENT_ASSOCIATION); skipping CI trigger."
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Strip quoted lines and check for trigger keywords.
          # `|| true` because grep exits non-zero when every line is quoted
          # (no lines left), which would otherwise fail the step under `bash -e`.
          CLEAN_BODY=$(echo "$COMMENT_BODY" | grep -v '^[[:space:]]*>' || true)

          # Supported commands:
          #   @scylladbbot trigger-thin-ci - thin CI on a draft PR
          #   @scylladbbot help            - list the available commands
          #   @scylladbbot trigger-ci      - full CI (loosely matched, as before)
          # 'run-for-draft', the old name of 'trigger-thin-ci', is still
          # accepted but no longer advertised.
          # 'valid' means "go on and trigger CI"; 'command' tells the later
          # steps which command was requested.
          if echo "$CLEAN_BODY" | grep -qiE '@scylladbbot[[:space:]]+(trigger-thin-ci|run-for-draft)\b'; then
            echo "command=trigger-thin-ci" >> "$GITHUB_OUTPUT"
            echo "valid=true" >> "$GITHUB_OUTPUT"
          elif echo "$CLEAN_BODY" | grep -qiE '@scylladbbot[[:space:]]+/?help\b'; then
            echo "command=help" >> "$GITHUB_OUTPUT"
            echo "valid=false" >> "$GITHUB_OUTPUT"
          elif echo "$CLEAN_BODY" | grep -qi '@scylladbbot' && echo "$CLEAN_BODY" | grep -qi 'trigger-ci'; then
            echo "command=trigger-ci" >> "$GITHUB_OUTPUT"
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reply to help command
        if: github.event_name == 'issue_comment' && steps.comment-check.outputs.command == 'help'
        env:
          # Reply as scylladbbot rather than github-actions[bot]. Its own
          # comments are excluded by the job-level 'if', so the command list
          # in this reply cannot re-trigger the workflow.
          BOT_TOKEN: ${{ secrets.AUTO_BACKPORT_TOKEN }}
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.comment.user.login }}
        shell: bash
        run: |
          BODY=$(cat << 'HELP_EOF'
          Available `@scylladbbot` commands (scylladb org members only):

          | Command | Description |
          |---------|-------------|
          | `@scylladbbot trigger-ci` | Trigger a full CI run for this PR. |
          | `@scylladbbot trigger-thin-ci` | Trigger a thin CI run (dev-mode build + unit tests, no dtest or artifact tests) for a **draft** PR. Runs once per comment; comment again after pushing new changes. |
          | `@scylladbbot help` | Show this message. |
          HELP_EOF
          )
          post_bot_reply "$PR_REPO" "$PR_NUMBER" "@${ACTOR} ${BODY}"

      - name: Resolve PR context
        if: github.event_name != 'issue_comment' || steps.comment-check.outputs.valid == 'true'
        id: resolve-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          # PR event context
          PR_NUMBER_FROM_EVENT: ${{ github.event.pull_request.number }}
          PR_REPO_FROM_EVENT: ${{ github.repository }}
          PR_SHA_FROM_EVENT: ${{ github.event.pull_request.head.sha }}
          PR_USER_FROM_EVENT: ${{ github.event.pull_request.user.login }}
          PR_DRAFT_FROM_EVENT: ${{ github.event.pull_request.draft }}
          PR_BASE_FROM_EVENT: ${{ github.event.pull_request.base.ref }}
          PR_URL_FROM_EVENT: ${{ github.event.pull_request.html_url }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          # Comment event context
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_COMMAND: ${{ steps.comment-check.outputs.command }}
          COMMENT_ACTOR: ${{ github.event.comment.user.login }}
          # Replies to @scylladbbot commands are posted as scylladbbot; only
          # comment events reply, so don't expose the token to other events
          BOT_TOKEN: ${{ github.event_name == 'issue_comment' && secrets.AUTO_BACKPORT_TOKEN || '' }}
          # Manual dispatch context
          DISPATCH_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          DISPATCH_TARGET_REPO: ${{ github.event.inputs.target_repo }}
        shell: bash
        run: |
          PR_REPO="$PR_REPO_FROM_EVENT"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # For manual dispatch, use the target repo input (defaults to scylladb/scylladb)
            PR_REPO="$DISPATCH_TARGET_REPO"
            PR_NUMBER="$DISPATCH_PR_NUMBER"
            PR_JSON=$(gh_api_retry "repos/$PR_REPO/pulls/$PR_NUMBER")
            PR_SHA=$(echo "$PR_JSON" | jq -r '.head.sha')
            PR_USER=$(echo "$PR_JSON" | jq -r '.user.login')
            PR_DRAFT=$(echo "$PR_JSON" | jq -r '.draft')
            BASE_BRANCH=$(echo "$PR_JSON" | jq -r '.base.ref')
            PR_URL=$(echo "$PR_JSON" | jq -r '.html_url')
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            # For comment events, fetch PR details from the API
            PR_NUMBER="$ISSUE_NUMBER"
            PR_JSON=$(gh_api_retry "repos/$PR_REPO/pulls/$PR_NUMBER")
            PR_SHA=$(echo "$PR_JSON" | jq -r '.head.sha')
            PR_USER=$(echo "$PR_JSON" | jq -r '.user.login')
            PR_DRAFT=$(echo "$PR_JSON" | jq -r '.draft')
            BASE_BRANCH=$(echo "$PR_JSON" | jq -r '.base.ref')
            PR_URL=$(echo "$PR_JSON" | jq -r '.html_url')
          else
            PR_NUMBER="$PR_NUMBER_FROM_EVENT"
            PR_SHA="$PR_SHA_FROM_EVENT"
            PR_USER="$PR_USER_FROM_EVENT"
            PR_DRAFT="$PR_DRAFT_FROM_EVENT"
            BASE_BRANCH="$PR_BASE_FROM_EVENT"
            PR_URL="$PR_URL_FROM_EVENT"
          fi

          # '@scylladbbot trigger-thin-ci' only makes sense on a draft PR; point
          # the commenter at 'trigger-ci' instead of silently doing nothing.
          if [ "$EVENT_NAME" = "issue_comment" ] && [ "$COMMENT_COMMAND" = "trigger-thin-ci" ] && [ "$PR_DRAFT" != "true" ]; then
            echo "::warning::PR #$PR_NUMBER is not a draft; ignoring '@scylladbbot trigger-thin-ci'"
            post_bot_reply "$PR_REPO" "$PR_NUMBER" \
              "@${COMMENT_ACTOR} this PR is not a draft, so \`trigger-thin-ci\` does not apply. Use \`@scylladbbot trigger-ci\` to run full CI."
            echo "should_continue=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Draft PRs get no CI by default. They get a thin (dev-mode only) CI
          # run when an org member comments '@scylladbbot trigger-thin-ci'.
          THIN_CI=false
          if [ "$PR_DRAFT" = "true" ]; then
            if [ "$EVENT_NAME" = "issue_comment" ] && [ "$COMMENT_COMMAND" = "trigger-thin-ci" ]; then
              echo "PR #$PR_NUMBER is a draft and '@scylladbbot trigger-thin-ci' was requested, running thin CI"
              THIN_CI=true
            else
              echo "::warning::PR #$PR_NUMBER is a draft, skipping CI trigger"
              if [ "$EVENT_NAME" = "issue_comment" ]; then
                post_bot_reply "$PR_REPO" "$PR_NUMBER" \
                  "@${COMMENT_ACTOR} this PR is a draft, so full CI was not triggered. Use \`@scylladbbot trigger-thin-ci\` for a thin CI run, or mark the PR ready for review."
              fi
              echo "should_continue=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Check for code changes on synchronize (skip commit-message-only pushes)
          if [ "$EVENT_ACTION" = "synchronize" ]; then
            if [ -n "$BEFORE_SHA" ] && [ -n "$AFTER_SHA" ]; then
              BEFORE_TREE=$(gh_api_retry "repos/$PR_REPO/git/commits/$BEFORE_SHA" --jq '.tree.sha' 2>/dev/null || true)
              AFTER_TREE=$(gh_api_retry "repos/$PR_REPO/git/commits/$AFTER_SHA" --jq '.tree.sha' 2>/dev/null || true)
              if [ -n "$BEFORE_TREE" ] && [ -n "$AFTER_TREE" ] && [ "$BEFORE_TREE" = "$AFTER_TREE" ]; then
                echo "No code changes detected (commit message edit only), skipping CI"
                echo "should_continue=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi

          echo "should_continue=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_repo=$PR_REPO" >> "$GITHUB_OUTPUT"
          echo "pr_sha=$PR_SHA" >> "$GITHUB_OUTPUT"
          echo "pr_user=$PR_USER" >> "$GITHUB_OUTPUT"
          echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "thin_ci=$THIN_CI" >> "$GITHUB_OUTPUT"

      - name: Check if docs-only PR
        if: steps.resolve-pr.outputs.should_continue == 'true'
        id: docs-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve-pr.outputs.pr_number }}
          PR_REPO: ${{ steps.resolve-pr.outputs.pr_repo }}
        run: |
          echo "Fetching PR #$PR_NUMBER files from $PR_REPO..."
          ALL_DOCS=true
          TRIGGER_DOCS_CI=false
          HAS_DOC_FILES=false

          # Fetch all pages of PR files
          PAGE=1
          while true; do
            FILES=$(gh_api_retry "repos/$PR_REPO/pulls/$PR_NUMBER/files?per_page=100&page=$PAGE" --jq '.[].filename')
            if [ -z "$FILES" ]; then
              break
            fi

            while IFS= read -r FILE; do
              [ -z "$FILE" ] && continue
              # Check for files that DON'T need Sphinx build
              # (.github/*, docs/dev/*, README.md, docs/*.py, top-level *.md,
              # .coderabbit.yaml - review config, must live at the repo root)
              if echo "$FILE" | grep -qE '^docs/dev/|(/)?README\.md$|^docs/.*\.py$|^\.github|^[a-zA-Z0-9]+\.md$|^\.coderabbit\.yaml$'; then
                HAS_DOC_FILES=true
              # Check for docs files that DO need Sphinx build
              elif echo "$FILE" | grep -qE '^docs/'; then
                HAS_DOC_FILES=true
                TRIGGER_DOCS_CI=true
              else
                ALL_DOCS=false
              fi
            done <<< "$FILES"

            PAGE=$((PAGE + 1))
          done

          if [ "$HAS_DOC_FILES" = "true" ] && [ "$ALL_DOCS" = "true" ]; then
            echo "is_docs_only=true" >> "$GITHUB_OUTPUT"
            echo "PR contains only documentation files, scylla-ci is not required"
          else
            echo "is_docs_only=false" >> "$GITHUB_OUTPUT"
          fi
          echo "trigger_docs_ci=$TRIGGER_DOCS_CI" >> "$GITHUB_OUTPUT"

      - name: Trigger docs-CI
        if: steps.resolve-pr.outputs.should_continue == 'true' && steps.docs-check.outputs.trigger_docs_ci == 'true'
        env:
          JENKINS_USER: ${{ secrets.JENKINS_USERNAME }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_TOKEN }}
          PR_NUMBER: ${{ steps.resolve-pr.outputs.pr_number }}
          PR_REPO: ${{ steps.resolve-pr.outputs.pr_repo }}
        run: |
          DOCS_CI_JOB="releng/job/scylladb-docs-CI"
          JOB_URL="$JENKINS_URL/job/$DOCS_CI_JOB/api/json"

          # Check if docs-CI job exists
          if curl --silent --fail --user "$JENKINS_USER:$JENKINS_API_TOKEN" "$JOB_URL" > /dev/null 2>&1; then
            echo "Triggering docs-CI for PR #$PR_NUMBER"
            curl -X POST "$JENKINS_URL/job/$DOCS_CI_JOB/buildWithParameters" \
              --fail --user "$JENKINS_USER:$JENKINS_API_TOKEN" \
              --data-urlencode "REPO_NAME=$PR_REPO" \
              --data-urlencode "PR_NUMBER=$PR_NUMBER" \
              --data-urlencode "POST_PR_COMMENT=true"
          else
            echo "docs-CI job not found, skipping"
          fi

      - name: Get PR details
        if: steps.resolve-pr.outputs.should_continue == 'true' && steps.docs-check.outputs.is_docs_only != 'true'
        id: pr-details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve-pr.outputs.pr_number }}
          PR_REPO: ${{ steps.resolve-pr.outputs.pr_repo }}
          PR_URL: ${{ steps.resolve-pr.outputs.pr_url }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_COMMAND: ${{ steps.comment-check.outputs.command }}
          COMMENT_ACTOR: ${{ github.event.comment.user.login }}
          # Replies to @scylladbbot commands are posted as scylladbbot; only
          # comment events reply, so don't expose the token to other events
          BOT_TOKEN: ${{ github.event_name == 'issue_comment' && secrets.AUTO_BACKPORT_TOKEN || '' }}
        run: |
          echo "Fetching PR #$PR_NUMBER details..."
          PR_JSON=$(gh_api_retry "repos/$PR_REPO/pulls/$PR_NUMBER")
          MERGEABLE_STATE=$(echo "$PR_JSON" | jq -r '.mergeable_state')
          # true only once GitHub confirmed the PR has no merge conflicts
          MERGEABLE=$(echo "$PR_JSON" | jq -r '.mergeable')

          # GitHub computes mergeability asynchronously and reports "mergeable"
          # as null while it does; poll a few times so we don't act on a
          # still-pending computation. The decision below is based on "mergeable"
          # (mergeable_state can still read "unknown" once it is known, so don't
          # wait on that). Right after a push GitHub recomputes it, and if it is
          # still null when we give up, a 'conflicts' label blocks CI, so allow it
          # some time. A closed/merged PR keeps "mergeable" null for good, so don't
          # wait on it.
          POLL_ATTEMPTS=0
          POLL_MAX=10
          while [ "$MERGEABLE" = "null" ] && [ "$(echo "$PR_JSON" | jq -r '.state')" = "open" ] && [ "$POLL_ATTEMPTS" -lt "$POLL_MAX" ]; do
            POLL_ATTEMPTS=$((POLL_ATTEMPTS + 1))
            echo "Mergeability is not computed yet (mergeable=$MERGEABLE, mergeable_state=$MERGEABLE_STATE), waiting for GitHub (attempt $POLL_ATTEMPTS/$POLL_MAX)..."
            sleep 2
            PR_JSON=$(gh_api_retry "repos/$PR_REPO/pulls/$PR_NUMBER")
            MERGEABLE_STATE=$(echo "$PR_JSON" | jq -r '.mergeable_state')
            MERGEABLE=$(echo "$PR_JSON" | jq -r '.mergeable')
          done

          LABELS=$(echo "$PR_JSON" | jq -r '[.labels[].name] | join(",")')

          HAS_CONFLICTS=false
          RUN_ARTIFACTS=false
          SKIP_UNITTEST_CUSTOM=false
          FORCE_ON_CLOUD=false
          PYTEST_EXTRA_OPTIONS=""

          # Check labels
          if echo "$PR_JSON" | jq -e 'any(.labels[]; .name == "conflicts")' >/dev/null; then
            HAS_CONFLICTS=true
          fi
          if echo "$LABELS" | grep -q "ci/requires_artifact_tests"; then
            RUN_ARTIFACTS=true
          fi
          if echo "$LABELS" | grep -q "ci/skip_unit-tests_custom"; then
            SKIP_UNITTEST_CUSTOM=true
          fi
          if echo "$LABELS" | grep -q "ci/force_on_cloud"; then
            FORCE_ON_CLOUD=true
          fi

          # Collect ci/consider-as-closed/<issue> labels
          CONSIDER_CLOSED=$(echo "$PR_JSON" | jq -r '[.labels[].name | select(startswith("ci/consider-as-closed/")) | ltrimstr("ci/consider-as-closed/")] | .[]')
          for ISSUE in $CONSIDER_CLOSED; do
            PYTEST_EXTRA_OPTIONS="$PYTEST_EXTRA_OPTIONS --consider-as-closed $ISSUE"
          done
          PYTEST_EXTRA_OPTIONS=$(echo "$PYTEST_EXTRA_OPTIONS" | sed 's/^ //')

          # Check conflict state. "mergeable" is GitHub's answer to "does this PR have
          # merge conflicts?": false means conflicts (normally mergeable_state "dirty",
          # also for draft PRs), true means none, null means not computed yet.
          # Check it before mergeable_state, which can still read "unknown" while
          # "mergeable" is already known.
          # BLOCK_REASON says why CI is blocked, for the reply to a comment command.
          BLOCK_REASON=""
          # Who added the 'conflicts' label decides whether GitHub's answer can clear
          # it. conflict_reminder.yaml (as github-actions[bot]) adds it only when
          # "mergeable" is false, so that label goes stale once the conflicts are
          # resolved. Anyone else may mean something GitHub can't see: the backport
          # automation (scylladbbot) adds it when a cherry-pick conflicted and the PR
          # was opened with the conflict markers committed, which GitHub reports as
          # mergeable, and a person may add it by hand. Those labels are cleared by a
          # person (make-pr-ready-for-review.yaml then marks the PR ready, and
          # mergify.yml drafts mergify backports while it is set), so they keep
          # blocking CI whatever GitHub reports.
          # LABELER is empty when the label is absent, the lookup failed
          # (LABELER_LOOKUP_FAILED=true) or no event records who added it.
          LABELER=""
          LABELER_LOOKUP_FAILED=false
          if [ "$HAS_CONFLICTS" = "true" ]; then
            # The step's shell has no pipefail, so don't pipe the call into sort.
            # The events API doesn't guarantee chronological order, so pick the
            # latest by created_at (ISO 8601 UTC, so it sorts as text).
            if LABELERS=$(gh_api_retry --paginate "repos/$PR_REPO/issues/$PR_NUMBER/events?per_page=100" \
                --jq '.[] | select(.event == "labeled" and .label.name == "conflicts") | [.created_at, .actor.login] | @tsv'); then
              LABELER=$(printf '%s\n' "$LABELERS" | sort -s -k1,1 | tail -n 1 | cut -f2)
            else
              LABELER_LOOKUP_FAILED=true
              echo "::warning::Failed to look up who added the 'conflicts' label to $PR_URL"
            fi
          fi
          KEEP_LABEL=false
          if [ -n "$LABELER" ] && [ "$LABELER" != "github-actions[bot]" ]; then
            KEEP_LABEL=true
          fi
          if [ "$MERGEABLE_STATE" = "dirty" ] || [ "$MERGEABLE" = "false" ]; then
            BLOCK_REASON=conflicts
            echo "::warning::CI will not be triggered since $PR_URL has conflicts (mergeable=$MERGEABLE, mergeable_state=$MERGEABLE_STATE)"
            HAS_CONFLICTS=true
          elif [ "$KEEP_LABEL" = "true" ]; then
            BLOCK_REASON=kept-label
            echo "::warning::CI will not be triggered since $PR_URL has the 'conflicts' label added by $LABELER; remove it once the conflicts are resolved"
          elif [ "$MERGEABLE" = "true" ]; then
            # A 'conflicts' label here is stale: nothing removes it once applied, so a
            # PR that resolved its conflicts (e.g. via a force-push) stayed blocked from
            # CI forever. "mergeable" is true for any conflict-free PR -- not only for
            # mergeable_state "clean", but also e.g. "unstable" (a non-passing commit
            # status, which a PR that CI refuses to run on typically has) or "blocked"
            # (missing approvals) -- so trust GitHub over the label and clean it up.
            # Labels that GitHub's answer can't clear are handled above.
            # Removing the label with GITHUB_TOKEN doesn't trigger other workflows, so
            # it doesn't mark a draft PR ready for review.
            if [ "$HAS_CONFLICTS" = "true" ] && [ -z "$LABELER" ]; then
              # Don't remove a label without knowing who added it. A failed lookup
              # may succeed on retry; a missing labeling event won't come back.
              if [ "$LABELER_LOOKUP_FAILED" = "true" ]; then
                BLOCK_REASON=labeler-lookup-failed
                echo "::warning::CI will not be triggered since $PR_URL has the 'conflicts' label and looking up who added it failed"
              else
                BLOCK_REASON=unknown-labeler
                echo "::warning::CI will not be triggered since $PR_URL has the 'conflicts' label and no event records who added it"
              fi
            elif [ "$HAS_CONFLICTS" = "true" ]; then
              echo "PR has no merge conflicts (mergeable_state=$MERGEABLE_STATE), removing stale 'conflicts' label"
              if DELETE_ERR=$(gh_api_retry -X DELETE "repos/$PR_REPO/issues/$PR_NUMBER/labels/conflicts" --silent 2>&1); then
                HAS_CONFLICTS=false
              elif printf '%s' "$DELETE_ERR" | grep -q 'HTTP 404' \
                && CURRENT_LABELS=$(gh_api_retry "repos/$PR_REPO/issues/$PR_NUMBER/labels?per_page=100" --jq '.[].name') \
                && ! printf '%s\n' "$CURRENT_LABELS" | grep -qx 'conflicts'; then
                # A 404 can also mean a wrong repo/PR or no access, so only treat it as
                # success once a re-read confirms the label is gone (removed by a
                # concurrent run or manually)
                echo "'conflicts' label is already gone from $PR_URL"
                HAS_CONFLICTS=false
              else
                BLOCK_REASON=remove-failed
                # DELETE_ERR also holds the retry messages; a ::warning:: shows only
                # one line, so report the final error there and the full text below it.
                echo "::warning::Failed to remove stale 'conflicts' label from $PR_URL; CI will not be triggered: $(printf '%s' "$DELETE_ERR" | tail -n 1)"
                printf '%s\n' "$DELETE_ERR"
              fi
            fi
          else
            # GitHub still hasn't computed mergeability after polling; don't block CI
            # on that alone (it would need a manual push/comment to unstick once GitHub
            # resolves it) -- fall back to the 'conflicts' label state.
            echo "::warning::GitHub did not determine mergeability for $PR_URL yet (mergeable=$MERGEABLE, mergeable_state=$MERGEABLE_STATE); falling back to the 'conflicts' label state"
            if [ "$HAS_CONFLICTS" = "true" ]; then
              BLOCK_REASON=undetermined
              echo "::warning::CI will not be triggered since $PR_URL has the 'conflicts' label"
            fi
          fi

          # Don't refuse an explicit '@scylladbbot trigger-ci'/'trigger-thin-ci' silently.
          # Other events (push, ready_for_review, reopened, workflow_dispatch) are
          # intentionally silent beyond the log warnings above: there is no command to
          # answer, and a PR with real conflicts would get a comment on every push.
          if [ "$HAS_CONFLICTS" = "true" ] && [ "$EVENT_NAME" = "issue_comment" ]; then
            RETRY_HINT="comment \`@scylladbbot ${COMMENT_COMMAND}\` again"
            case "$BLOCK_REASON" in
              conflicts)
                # Thin CI runs only on draft PRs, which get no CI on push, so the
                # commenter has to ask again explicitly. A push doesn't start CI
                # automatically for an external contributor either (see "Check
                # trusted contributor"), so don't promise it unconditionally.
                if [ "$KEEP_LABEL" = "true" ]; then
                  # A push alone won't unblock it: the label stays until removed
                  AFTER_PUSH="then remove the 'conflicts' label, which re-runs CI routing; if CI still does not start, comment \`@scylladbbot trigger-ci\`"
                elif [ "$COMMENT_COMMAND" = "trigger-thin-ci" ]; then
                  AFTER_PUSH="then $RETRY_HINT"
                else
                  AFTER_PUSH="CI will start on the next push for trusted contributors; otherwise $RETRY_HINT"
                fi
                REPLY="CI was not triggered because this PR has merge conflicts with the base branch. Please rebase and resolve them; ${AFTER_PUSH}."
                ;;
              kept-label)
                # Removing the label re-runs this workflow (the 'unlabeled' trigger) and
                # make-pr-ready-for-review.yaml marks a draft PR ready, so CI starts
                # on its own for a trusted author; asking for a comment as well would
                # start CI twice. After that the PR is no longer a draft, so point at
                # 'trigger-ci' rather than the original command.
                REPLY="CI was not triggered because this PR carries the 'conflicts' label, added by ${LABELER} (only a label added for merge conflicts reported by GitHub is removed automatically). Once the conflicts are resolved, remove the label, which re-runs CI routing (and marks a draft PR ready for review); if CI still does not start, comment \`@scylladbbot trigger-ci\`."
                ;;
              labeler-lookup-failed)
                REPLY="CI was not triggered: GitHub reports no merge conflicts, but looking up who added the 'conflicts' label failed, so it was not removed (see the workflow log). Please ${RETRY_HINT} to retry, or remove the label if the conflicts are resolved."
                ;;
              unknown-labeler)
                REPLY="CI was not triggered: GitHub reports no merge conflicts, but no event records who added the 'conflicts' label, so it was not removed automatically (it may have been added for a reason GitHub cannot see, such as committed conflict markers). If that reason no longer applies, remove the label, which re-runs CI routing (and marks a draft PR ready for review); if CI still does not start, comment \`@scylladbbot trigger-ci\`."
                ;;
              remove-failed)
                REPLY="CI was not triggered: GitHub reports no merge conflicts, but the stale 'conflicts' label could not be cleared (see the workflow log). Please ${RETRY_HINT} to retry, or remove the label if the conflicts are resolved."
                ;;
              *)
                REPLY="CI was not triggered: GitHub has not determined whether this PR is mergeable yet, and it carries the 'conflicts' label. Please ${RETRY_HINT} in a few minutes."
                ;;
            esac
            post_bot_reply "$PR_REPO" "$PR_NUMBER" "@${COMMENT_ACTOR} ${REPLY}"
          fi

          echo "has_conflicts=$HAS_CONFLICTS" >> "$GITHUB_OUTPUT"
          echo "run_artifacts=$RUN_ARTIFACTS" >> "$GITHUB_OUTPUT"
          echo "skip_unittest_custom=$SKIP_UNITTEST_CUSTOM" >> "$GITHUB_OUTPUT"
          echo "force_on_cloud=$FORCE_ON_CLOUD" >> "$GITHUB_OUTPUT"
          echo "pytest_extra_options=$PYTEST_EXTRA_OPTIONS" >> "$GITHUB_OUTPUT"

      - name: Determine target folder
        if: steps.resolve-pr.outputs.should_continue == 'true' && steps.docs-check.outputs.is_docs_only != 'true'
        id: target-folder
        env:
          BASE_BRANCH: ${{ steps.resolve-pr.outputs.base_branch }}
        run: |
          FOLDER=""
          if [ "$BASE_BRANCH" = "master" ] || [ "$BASE_BRANCH" = "next" ]; then
            FOLDER="scylla-master"
          elif [ "$BASE_BRANCH" = "enterprise" ] || [ "$BASE_BRANCH" = "next-enterprise" ]; then
            FOLDER="scylla-enterprise"
          elif echo "$BASE_BRANCH" | grep -qE '^(next|branch)-'; then
            VERSION=$(echo "$BASE_BRANCH" | sed -E 's/^(next|branch)-//')
            if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+$'; then
              MAJOR=$(echo "$VERSION" | cut -d. -f1)
              if [ "$MAJOR" -ge 2023 ] && [ "$MAJOR" -lt 2025 ]; then
                FOLDER="enterprise-$VERSION"
              else
                FOLDER="scylla-$VERSION"
              fi
            fi
          else
            echo "::warning::Not supported base branch: $BASE_BRANCH"
          fi

          echo "folder=$FOLDER" >> "$GITHUB_OUTPUT"
          echo "Target folder: $FOLDER"

      - name: Check required CI types
        if: steps.resolve-pr.outputs.should_continue == 'true' && steps.docs-check.outputs.is_docs_only != 'true'
        id: required-checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve-pr.outputs.pr_number }}
          PR_REPO: ${{ steps.resolve-pr.outputs.pr_repo }}
        run: |
          # Fetch all PR files for pattern matching
          ALL_FILES=""
          PAGE=1
          while true; do
            FILES=$(gh_api_retry "repos/$PR_REPO/pulls/$PR_NUMBER/files?per_page=100&page=$PAGE" --jq '.[].filename')
            if [ -z "$FILES" ]; then
              break
            fi
            if [ -n "$ALL_FILES" ]; then
              ALL_FILES="$ALL_FILES"$'\n'"$FILES"
            else
              ALL_FILES="$FILES"
            fi
            PAGE=$((PAGE + 1))
          done

          # build: required if any file does NOT match scripts/pull_github_pr.sh
          BUILD_REQUIRED=false
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            if [ "$FILE" != "scripts/pull_github_pr.sh" ]; then
              BUILD_REQUIRED=true
              break
            fi
          done <<< "$ALL_FILES"

          # Files that cannot affect dtest or unit-test results:
          # docs/, .github/, *.md at any depth, root repo-metadata dotfiles,
          # licenses/, NOTICE.txt and ORIGIN.
          NON_CODE='docs/|\.github/|(.*/)?[^/]+\.md$|\.(clang-format|coderabbit\.yaml|dockerignore|gitattributes|gitignore|gitorderfile|mailmap)$|licenses/|NOTICE\.txt$|ORIGIN$'

          # dtest: required if any file does NOT match test*, dist/docker/*, dist/common/scripts/*, NON_CODE
          DTEST_REQUIRED=false
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            if ! echo "$FILE" | grep -qE "^(test(\.py|/)|dist/docker/|dist/common/scripts/|$NON_CODE)"; then
              DTEST_REQUIRED=true
              break
            fi
          done <<< "$ALL_FILES"

          # unittest: required if any file does NOT match dist/docker/*, dist/common/scripts*, NON_CODE
          UNITTEST_REQUIRED=false
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            if ! echo "$FILE" | grep -qE "^(dist/docker/|dist/common/scripts|$NON_CODE)"; then
              UNITTEST_REQUIRED=true
              break
            fi
          done <<< "$ALL_FILES"

          # artifacts: required if any file matches dist/* or tools/toolchain*
          ARTIFACTS_REQUIRED=false
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            if echo "$FILE" | grep -qE '^(dist|tools/toolchain)'; then
              ARTIFACTS_REQUIRED=true
              break
            fi
          done <<< "$ALL_FILES"

          # Artifacts label override
          if [ "${{ steps.pr-details.outputs.run_artifacts }}" = "true" ]; then
            ARTIFACTS_REQUIRED=true
          fi

          # No artifact tests for scylla-enterprise
          if [ "${{ steps.target-folder.outputs.folder }}" = "scylla-enterprise" ]; then
            ARTIFACTS_REQUIRED=false
          fi

          # scylla_gdb: run ONLY the scylla_gdb suite if EVERY changed file matches
          # scylla-gdb.py or test/scylla_gdb/*. A PR changing only
          # scylla-gdb.py is treated the same as one changing only test/scylla_gdb.
          GDB_REQUIRED=false
          GDB_HAS_FILES=false
          GDB_ONLY=true
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            GDB_HAS_FILES=true
            if ! echo "$FILE" | grep -qE '^(scylla-gdb\.py|test/scylla_gdb/)'; then
              GDB_ONLY=false
              break
            fi
          done <<< "$ALL_FILES"
          if [ "$GDB_HAS_FILES" = "true" ] && [ "$GDB_ONLY" = "true" ]; then
            GDB_REQUIRED=true
            # Run only the scylla_gdb suite: RUN_UNIT_TEST must be false so scylla-ci
            # restricts the run to includeTests=scylla_gdb instead of all unit tests.
            DTEST_REQUIRED=false
            UNITTEST_REQUIRED=false
            ARTIFACTS_REQUIRED=false
          fi

          # Thin CI for draft PRs: dev-mode build + unit tests only,
          # never dtest or artifact tests.
          if [ "${{ steps.resolve-pr.outputs.thin_ci }}" = "true" ]; then
            DTEST_REQUIRED=false
            ARTIFACTS_REQUIRED=false
          fi

          echo "build_required=$BUILD_REQUIRED" >> "$GITHUB_OUTPUT"
          echo "dtest_required=$DTEST_REQUIRED" >> "$GITHUB_OUTPUT"
          echo "unittest_required=$UNITTEST_REQUIRED" >> "$GITHUB_OUTPUT"
          echo "artifacts_required=$ARTIFACTS_REQUIRED" >> "$GITHUB_OUTPUT"
          echo "gdb_required=$GDB_REQUIRED" >> "$GITHUB_OUTPUT"

          echo "Required checks: build=$BUILD_REQUIRED dtest=$DTEST_REQUIRED unittest=$UNITTEST_REQUIRED artifacts=$ARTIFACTS_REQUIRED gdb=$GDB_REQUIRED"

      - name: Check trusted contributor
        if: steps.resolve-pr.outputs.should_continue == 'true' && steps.docs-check.outputs.is_docs_only != 'true' && github.event_name != 'issue_comment' && github.event_name != 'workflow_dispatch'
        id: trust-check
        env:
          GH_TOKEN: ${{ secrets.AUTO_BACKPORT_TOKEN }}
          PR_USER: ${{ steps.resolve-pr.outputs.pr_user }}
          PR_REPO: ${{ steps.resolve-pr.outputs.pr_repo }}
          PR_NUMBER: ${{ steps.resolve-pr.outputs.pr_number }}
        run: |
          TRUSTED=false

          # Check if user is a ScyllaDB org member (204 -> success/exit 0,
          # 404 -> not a member -> non-zero). Rely on the return code rather
          # than parsing stdout, which is empty for these --silent calls.
          if gh_api_retry "orgs/scylladb/members/$PR_USER" --silent >/dev/null 2>&1; then
            TRUSTED=true
          else
            # Check if user is in the external-contributors team
            TEAM_STATE=$(gh_api_retry "orgs/scylladb/teams/external-contributors/memberships/$PR_USER" --jq '.state' 2>/dev/null || echo "none")
            if [ "$TEAM_STATE" = "active" ]; then
              TRUSTED=true
            fi
          fi

          if [ "$TRUSTED" = "false" ]; then
            echo "::warning::PR submitted by external contributor ($PR_USER), CI will not trigger automatically"
            TARGET_FOLDER="${{ steps.target-folder.outputs.folder }}"
            gh_api_retry "repos/$PR_REPO/issues/$PR_NUMBER/comments" \
              -f body="@scylladb/scylla-maint please review and trigger CI for this pull request
          **CI Build:** https://jenkins.scylladb.com/job/${TARGET_FOLDER}/job/scylla-ci/parambuild/?PR_NUMBER=${PR_NUMBER}"
          fi

          echo "trusted=$TRUSTED" >> "$GITHUB_OUTPUT"

      - name: Trigger scylla-ci
        if: |
          steps.resolve-pr.outputs.should_continue == 'true' &&
          steps.docs-check.outputs.is_docs_only != 'true' &&
          (steps.trust-check.outputs.trusted == 'true' || github.event_name == 'issue_comment' || github.event_name == 'workflow_dispatch') &&
          steps.pr-details.outputs.has_conflicts != 'true' &&
          steps.required-checks.outputs.build_required == 'true' &&
          steps.target-folder.outputs.folder != ''
        env:
          JENKINS_USER: ${{ secrets.JENKINS_USERNAME }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve-pr.outputs.pr_number }}
          PR_REPO: ${{ steps.resolve-pr.outputs.pr_repo }}
          PR_SHA: ${{ steps.resolve-pr.outputs.pr_sha }}
        run: |
          TARGET_FOLDER="${{ steps.target-folder.outputs.folder }}"
          RUN_DTEST="${{ steps.required-checks.outputs.dtest_required }}"
          RUN_UNITTEST="${{ steps.required-checks.outputs.unittest_required }}"
          RUN_ARTIFACTS="${{ steps.required-checks.outputs.artifacts_required }}"
          SKIP_UNITTEST_CUSTOM="${{ steps.pr-details.outputs.skip_unittest_custom }}"
          FORCE_ON_CLOUD="${{ steps.pr-details.outputs.force_on_cloud }}"
          RUN_GDB_ONLY="${{ steps.required-checks.outputs.gdb_required }}"
          PYTEST_EXTRA_OPTIONS="${{ steps.pr-details.outputs.pytest_extra_options }}"
          THIN_CI="${{ steps.resolve-pr.outputs.thin_ci }}"

          echo "Routing to $TARGET_FOLDER/scylla-ci with:"
          echo "  PR_NUMBER=$PR_NUMBER"
          echo "  RUN_DTEST=$RUN_DTEST"
          echo "  RUN_UNIT_TEST=$RUN_UNITTEST"
          echo "  RUN_ARTIFACT_TESTS=$RUN_ARTIFACTS"
          echo "  SKIP_UNIT_TEST_CUSTOM=$SKIP_UNITTEST_CUSTOM"
          echo "  FORCE_ON_CLOUD=$FORCE_ON_CLOUD"
          echo "  RUN_ONLY_SCYLLA_GDB=$RUN_GDB_ONLY"
          echo "  PYTEST_EXTRA_COMMANDLINE_OPTIONS=$PYTEST_EXTRA_OPTIONS"
          echo "  THIN_CI=$THIN_CI"

          JOB_PATH="$TARGET_FOLDER/job/scylla-ci"

          # Trigger the Jenkins job and capture the queue location
          RESPONSE=$(curl -s -i -X POST \
            "$JENKINS_URL/job/$JOB_PATH/buildWithParameters" \
            --user "$JENKINS_USER:$JENKINS_API_TOKEN" \
            --data-urlencode "PR_NUMBER=$PR_NUMBER" \
            --data-urlencode "RUN_DTEST=$RUN_DTEST" \
            --data-urlencode "RUN_UNIT_TEST=$RUN_UNITTEST" \
            --data-urlencode "RUN_ARTIFACT_TESTS=$RUN_ARTIFACTS" \
            --data-urlencode "SKIP_UNIT_TEST_CUSTOM=$SKIP_UNITTEST_CUSTOM" \
            --data-urlencode "FORCE_ON_CLOUD=$FORCE_ON_CLOUD" \
            --data-urlencode "RUN_ONLY_SCYLLA_GDB=$RUN_GDB_ONLY" \
            --data-urlencode "PYTEST_EXTRA_COMMANDLINE_OPTIONS=$PYTEST_EXTRA_OPTIONS" \
            --data-urlencode "THIN_CI=$THIN_CI" \
            -w "\n%{http_code}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Failed to trigger Jenkins job (HTTP $HTTP_CODE)"
            echo "$RESPONSE"
            exit 1
          fi

          # Extract queue URL from Location header
          QUEUE_URL=$(echo "$RESPONSE" | grep -i "^Location:" | sed 's/Location: //;s/\r//')
          echo "Jenkins queue URL: $QUEUE_URL"

          # Poll queue to get the build URL
          BUILD_URL=""
          for i in $(seq 1 30); do
            sleep 5
            QUEUE_JSON=$(curl -s --user "$JENKINS_USER:$JENKINS_API_TOKEN" "${QUEUE_URL}api/json" 2>/dev/null || true)
            BUILD_URL=$(echo "$QUEUE_JSON" | jq -r '.executable.url // empty' 2>/dev/null || true)
            if [ -n "$BUILD_URL" ]; then
              break
            fi
            echo "Waiting for build to start... (attempt $i/30)"
          done

          if [ -n "$BUILD_URL" ]; then
            echo "Jenkins build URL: $BUILD_URL"
          else
            echo "::warning::Could not determine Jenkins build URL from queue, using job URL"
            BUILD_URL="$JENKINS_URL/job/$JOB_PATH/"
          fi

          # Set pending commit status
          gh_api_retry "repos/$PR_REPO/statuses/$PR_SHA" \
            -f state="pending" \
            -f context="Checkout" \
            -f description="Waiting for CI to start" \
            -f target_url="$BUILD_URL"

      - name: Notify on failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          PR_NUMBER: ${{ steps.resolve-pr.outputs.pr_number }}
          PR_URL: ${{ steps.resolve-pr.outputs.pr_url }}
        run: |
          # Send Slack notification
          curl -X POST -H 'Content-type: application/json' \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            --data "{
              \"channel\": \"#releng-team\",
              \"text\": \":rotating_light: Scylla-CI-Route GitHub Action failed for PR #$PR_NUMBER ($PR_URL)\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"icon_emoji\": \":warning:\"
            }" \
            https://slack.com/api/chat.postMessage
